<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M&MGAMERV2</title>
  <style>
    @font-face {
      font-family: 'Copperplate';
      src: local('Copperplate');
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url('https://www.itl.cat/pngfile/big/256-2568578_color-cycling-pixel-art.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    /* Barra de navegación */
    .navbar {
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 1.1em;
      transition: color 0.3s;
    }

    .navbar a:hover {
      color: #ff4500;
    }

    /* Contenido */
    .container {
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-family: 'Copperplate', Arial, sans-serif;
      text-transform: uppercase;
      font-size: 3em;
      background-color: rgba(0, 0, 0, 0.6);
      display: inline-block;
      padding: 20px 40px;
      border-radius: 15px;
      color: black;
      -webkit-text-stroke: 2px #d500f9;
      text-shadow:
        0 0 10px #d500f9,
        0 0 20px #d500f9,
        0 0 30px #d500f9;
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px #d500f9, 0 0 20px #d500f9, 0 0 30px #d500f9; }
      50% { text-shadow: 0 0 20px #b000e0, 0 0 30px #b000e0, 0 0 40px #b000e0; }
      100% { text-shadow: 0 0 10px #d500f9, 0 0 20px #d500f9, 0 0 30px #d500f9; }
    }

    p.description {
      background-color: rgba(0, 0, 0, 0.7);
      display: inline-block;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 1.3em;
      font-weight: 500;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .button {
      background-color: #ff4500;
      color: white;
      padding: 10px 20px;
      border: none;
      font-size: 1em;
      cursor: pointer;
      margin-top: 20px;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
    }

    .button:hover {
      background-color: #ff6347;
    }

    /* Botón flotante de WhatsApp */
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }

    .whatsapp-float img {
      width: 60px;
      height: 60px;
    }
  </style>
</head>
<body>

  <!-- Barra de categorías -->
  <div class="navbar">
    <a href="#inicio">Inicio</a>
    <a href="#juegos">Juegos</a>
    <a href="#ofertas">Ofertas</a>
    <a href="#contacto">Contacto</a>
  </div>

  <!-- Contenido principal -->
  <div class="container" id="inicio">
    <h1>Bienvenido a M&M GAMERV2</h1><br><br>
    <p class="description">Descubre los mejores juegos para Xbox One y Series X|S al mejor precio. ¡Acción, aventura y diversión sin límites en tu consola favorita!</p><br><br>
    <a href="https://link-a-tu-juego.com" class="button">Jugar Ahora</a>
  </div>

  <!-- Botón flotante de WhatsApp -->
  <div class="whatsapp-float">
    <a href="https://wa.me/3112031399" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
    </a>
  </div>

</body>
</html>
