<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M&MGAMERV2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url(https://img.freepik.com/free-vector/background-pixel-rain-abstract_23-2148376183.jpg?semt=ais_hybrid&w=740);
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    /* Barra de navegación */
    .navbar {
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 1.1em;
      transition: color 0.3s;
    }

    .navbar a:hover {
      color: #ff4500;
    }

    /* Contenido */
    .container {
      text-align: center;
      padding-top: 100px;
    }

    h1, p {
      background-color: rgba(0, 0, 0, 0.6);
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
    }

    .button {
      background-color: #ff4500;
      color: white;
      padding: 10px 20px;
      border: none;
      font-size: 1em;
      cursor: pointer;
      margin-top: 20px;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
    }

    .button:hover {
      background-color: #ff6347;
    }
  </style>
</head>
<body>

  <!-- Barra de categorías -->
  <div class="navbar">
    <a href="#inicio">Inicio</a>
    <a href="#juegos">Juegos</a>
    <a href="#ofertas">Ofertas</a>
    <a href="#contacto">Contacto</a>
  </div>

  <!-- Contenido principal -->
  <div class="container" id="inicio">
    <h1>Bienvenido a M&M GAMERV2</h1><br><br>
    <p>Este es el sitio web oficial de VENTA DE JUEGOS. ¡Gracias por visitarlo!</p><br><br>
    <a href="https://link-a-tu-juego.com" class="button">Jugar Ahora</a>
  </div>

</body>
</html>
